[project]
name = "mapdet3d"
version = "0.1.0"
description = "Reimplementation of Map-Det3D: Metric Feed-Forward 3D Reconstruction Prior for Multi-view 3D Object Detection from Streaming Inputs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.8.0",
    "numpy",
    "scipy",
    "pyyaml",
    "einops",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Needed for the real MapAnything backbone (third_party/map-anything) and
# the real CA-1M loader (third_party/ml-cubifyanything). Not required for
# the synthetic-data pipeline (tools/train.py, tools/eval.py).
real-data = ["tifffile", "webdataset==0.2.86", "pip-system-certs", "plyfile", "opencv-python-headless==4.10.0.84"]
real-backbone = ["mapanything==1.1.4", "torchvision==0.23.0", "torchaudio==2.8.0"]

[tool.uv.sources]
mapanything = { path = "third_party/map-anything", editable = true }

[tool.setuptools.packages.find]
include = ["mapdet3d*"]

[tool.setuptools.package-data]
"mapdet3d.data.scannet" = ["*.txt", "*.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "real_backbone: requires external pretrained backbone weights",
    "real_data: requires a local CA-1M or ScanNet dataset",
]
